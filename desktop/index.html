<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGU Audio Lab</title>
<style>body{background:#10151e;color:#edf2fa;font:16px system-ui;max-width:760px;margin:40px auto;padding:20px}h1{font-size:28px}section{background:#1b2432;padding:24px;border-radius:14px;margin:20px 0}audio{width:100%;margin-top:20px}label{display:block;margin-top:18px}meter{width:100%;height:28px}small{color:#b4c1d4}canvas{width:100%;height:160px}button{padding:10px} </style>
<h1>MGU Audio Lab</h1><small>Desktop prototype · local file playback only</small>
<section><label for="file">Choose a music file</label><input id="file" type="file" accept="audio/*"><audio id="audio" controls></audio><p id="status" role="status">Waiting for a file.</p></section>
<section><h2>Live frequency levels</h2><div id="meters"></div><canvas id="spectrum" width="700" height="160" aria-label="Frequency spectrum"></canvas><p id="peak"></p><small>Relative spectral levels, not calibrated sound pressure. No vehicle connection.</small></section>
<script>
const file=document.getElementById('file'),audio=document.getElementById('audio'),status=document.getElementById('status'),canvas=document.getElementById('spectrum'),ctx=canvas.getContext('2d');
const bands=[['Bass',20,250],['Midrange',250,2000],['Treble',2000,20000]];
const meters=bands.map(([name])=>{const l=document.createElement('label');l.textContent=name;const m=document.createElement('meter');m.min=0;m.max=100;m.value=0;l.append(m);document.getElementById('meters').append(l);return m;});
let ac,an,data,url,frame;
file.onchange=()=>{if(!file.files[0])return;audio.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file.files[0]);audio.src=url;status.textContent='File selected. Press Play.';};
audio.addEventListener('error',()=>status.textContent='Unable to decode this file. Try an MP3 or WAV.');
audio.addEventListener('play',async()=>{try{if(!ac){ac=new AudioContext();an=ac.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=0.65;ac.createMediaElementSource(audio).connect(an);an.connect(ac.destination);data=new Float32Array(an.frequencyBinCount);}await ac.resume();status.textContent='Analyzing local playback';cancelAnimationFrame(frame);draw();}catch(e){status.textContent=e.message;}});
function draw(){an.getFloatFrequencyData(data);const step=ac.sampleRate/an.fftSize;let peak=-Infinity,idx=0;for(let i=1;i<data.length;i++){if(data[i]>peak){peak=data[i];idx=i;}}
bands.forEach((b,j)=>{let sum=0,n=0;for(let i=Math.ceil(b[1]/step);i<Math.min(data.length,Math.ceil(b[2]/step));i++){sum+=Math.pow(10,data[i]/10);n++;}const db=10*Math.log10(sum/Math.max(n,1));meters[j].value=Math.max(0,Math.min(100,(db+90)*100/80));});
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#62aaff';for(let x=0;x<100;x++){const hz=20*Math.pow(1000,x/99);const i=Math.min(data.length-1,Math.round(hz/step));const h=Math.max(0,Math.min(160,(data[i]+100)*1.6));ctx.fillRect(x*7,160-h,5,h);}
document.getElementById('peak').textContent=peak>-90?'Dominant frequency: '+Math.round(idx*step)+' Hz':'No strong signal';if(!audio.paused)frame=requestAnimationFrame(draw);}
function reset(){cancelAnimationFrame(frame);meters.forEach(m=>m.value=0);ctx.clearRect(0,0,canvas.width,canvas.height);document.getElementById('peak').textContent='';status.textContent='Playback stopped';}
audio.addEventListener('pause',reset);audio.addEventListener('ended',reset);
</script></html>
